<div class="admin-container">
  <div class="admin-panel">
    <h2 class="section-title" id="pageTitle">Laboratorio</h2>
    <div class="lab-editor">
      <h4 class="admin-panel__title" id="labEditorTitle">Nuevo Laboratorio</h4>
      <form class="modal-form" id="labEditorForm" novalidate>
        <div class="form-note form-note--error form-note--hidden" id="labEditorMessage" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="labEditorName">Nombre *</label>
          <input class="form-input" type="text" id="labEditorName" required placeholder="Ej: Lab A - Informática">
        </div>

        <div class="form-group">
          <label class="form-label" for="labEditorLocation">Ubicación *</label>
          <input class="form-input" type="text" id="labEditorLocation" required placeholder="Ej: Bloque B, Piso 2">
        </div>

        <div class="form-group">
          <label class="form-label" for="labEditorCapacity">Capacidad *</label>
          <input class="form-input" type="number" id="labEditorCapacity" min="1" required placeholder="Ej: 30">
        </div>

        <div class="form-group">
          <label class="form-label">Horarios no reservables (clases)</label>
          <div class="lab-schedule" id="labScheduleList"></div>
          <button class="btn btn--outline btn--sm" type="button" id="addScheduleRowBtn" style="margin-top:0.5rem;">
            <i class="bi bi-plus-circle"></i> Agregar horario
          </button>
        </div>

        <div class="modal-actions">
          <button class="btn btn--secondary" type="button" id="cancelLabEditorBtn">
            <i class="ph ph-arrow-left"></i> Volver
          </button>
          <button class="btn btn--primary" type="submit">
            <i class="ph ph-floppy-disk"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
