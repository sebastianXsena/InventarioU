<section class="view" id="loginView">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__icon"><i class="ph-duotone ph-lock-key"></i></div>
      <h2 class="auth-form__title">Bienvenido</h2>
      <p class="auth-form__subtitle">Ingresa tus credenciales para acceder</p>
    </div>
    <form class="auth-form" id="loginForm" novalidate>
      <div class="form-note form-note--error form-note--hidden" id="loginFormMessage" role="alert" aria-live="polite"></div>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email</label>
        <div class="form-input-with-icon">
          <i class="ph-duotone ph-envelope"></i>
          <input class="form-input" type="email" id="loginEmail" required placeholder="tu@email.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="loginPassword">Contraseña</label>
        <div class="form-input-with-icon">
          <i class="ph-duotone ph-password"></i>
          <input class="form-input" type="password" id="loginPassword" required placeholder="••••••••">
        </div>
      </div>
      <div style="text-align: right; margin-top: -0.5rem; margin-bottom: 1.25rem;">
        <a href="#" id="forgotPasswordLink" style="font-size: 0.85rem; color: #4f46e5; text-decoration: none; font-weight: 500;">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="btn btn--primary btn--full auth-btn" type="submit">Ingresar <i class="ph-duotone ph-arrow-right"></i></button>
    </form>
  </div>
</section>
