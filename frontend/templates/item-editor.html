<div class="admin-container">
  <div class="admin-panel">
    <h2 class="section-title" id="pageTitle">Material</h2>
    <div class="lab-editor">
      <h4 class="admin-panel__title" id="itemEditorTitle">Nuevo Material</h4>
      <form class="modal-form" id="itemEditorForm" novalidate>
        <div class="form-note form-note--error form-note--hidden" id="itemEditorMessage" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="itemEditorName">Nombre *</label>
          <input class="form-input" type="text" id="itemEditorName" required placeholder="Ej: Computadora Desktop">
        </div>

        <div class="form-group">
          <label class="form-label" for="itemEditorDescription">Descripción</label>
          <input class="form-input" type="text" id="itemEditorDescription" placeholder="Ej: PC con monitor 24 pulgadas">
        </div>

        <div class="form-group">
          <label class="form-label" for="itemEditorStock">Stock Total *</label>
          <input class="form-input" type="number" id="itemEditorStock" min="0" required placeholder="Ej: 30">
        </div>

        <div class="form-group">
          <label class="form-label" for="itemEditorLab">Laboratorio *</label>
          <select class="form-select" id="itemEditorLab" required>
            <option value="">Cargando laboratorios...</option>
          </select>
        </div>

        <div class="modal-actions">
          <button class="btn btn--secondary" type="button" id="cancelItemEditorBtn">
            <i class="ph ph-arrow-left"></i> Volver
          </button>
          <button class="btn btn--primary" type="submit">
            <i class="ph ph-floppy-disk"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
