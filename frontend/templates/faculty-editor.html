<div class="admin-container">
  <div class="admin-panel">
    <h2 class="section-title" id="pageTitle">Facultad</h2>
    <div class="lab-editor">
      <h4 class="admin-panel__title" id="facultyEditorTitle">Nueva Facultad</h4>
      <form class="modal-form" id="facultyEditorForm" novalidate>
        <div class="form-note form-note--error form-note--hidden" id="facultyEditorMessage" role="alert" aria-live="polite"></div>

        <div class="form-group">
          <label class="form-label" for="facultyEditorName">Nombre de la Facultad *</label>
          <input class="form-input" type="text" id="facultyEditorName" required placeholder="Ej: Facultad de Ingeniería">
        </div>

        <div class="modal-actions">
          <button class="btn btn--secondary" type="button" id="cancelFacultyEditorBtn">
            <i class="ph ph-arrow-left"></i> Volver
          </button>
          <button class="btn btn--primary" type="submit">
            <i class="ph ph-floppy-disk"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
