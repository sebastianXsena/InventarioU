<section class="view" id="reserveView">
  <div class="reserve-container">
    <h2 class="section-title">Nueva Reserva de Laboratorio</h2>
    <form class="reserve-form" id="reserveForm" novalidate>
      <div class="form-note form-note--error form-note--hidden" id="reserveFormMessage" role="alert" aria-live="polite"></div>
      <div class="form-row">
        <div class="form-group form-group--col">
          <label class="form-label" for="reserveLab">Laboratorio *</label>
          <select class="form-select" id="reserveLab" required>
            <option value="">Seleccionar laboratorio</option>
          </select>
        </div>
        <div class="form-group form-group--col">
          <label class="form-label" for="reserveDate">Fecha *</label>
          <input class="form-input" type="date" id="reserveDate" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group form-group--col">
          <label class="form-label" for="reserveStartTime">Hora inicio *</label>
          <input class="form-input" type="time" id="reserveStartTime" required>
        </div>
        <div class="form-group form-group--col">
          <label class="form-label" for="reserveEndTime">Hora fin *</label>
          <input class="form-input" type="time" id="reserveEndTime" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Materiales requeridos</label>
        <div class="items-selector" id="itemsSelector">
          <p class="items-selector__hint">Selecciona un laboratorio para ver materiales disponibles</p>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reserveNotes">Notas</label>
        <textarea class="form-input form-input--textarea" id="reserveNotes" maxlength="500"
          placeholder="Motivo de la reserva, detalles adicionales..."></textarea>
      </div>

      <button class="btn btn--primary btn--lg" type="submit">Solicitar Reserva</button>
    </form>
  </div>
</section>
